name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build single exe
        shell: pwsh
        run: .\build-single.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: padslogic-windows
          path: out_single/padslogic.exe
